apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-world

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-world

  template:
    metadata:
      labels:
        app: hello-world

    spec:
      containers:
        - name: hello-world
          image: vaishnavi3008/hello-world:IMAGE_TAG

          ports:
            - containerPort: 80